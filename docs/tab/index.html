<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ouro</title>
  <meta name="description" content="Ouro in a browser tab. One prompt, one eval, and a model that runs on this page.">
  <meta name="theme-color" content="#f3f0e8">
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/design-system.css">
  <style>
    .stage {
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 1.5rem;
    }

    form {
      width: min(100%, 34rem);
      display: flex;
      flex-direction: column;
      align-items: end;
      gap: 0.85rem;
    }

    textarea {
      width: 100%;
      min-height: 8.5rem;
      margin: 0;
      padding: 0.95rem 1rem;
      border: 1px solid var(--line);
      border-radius: 2px;
      background: transparent;
      color: var(--ink);
      font-family: var(--serif);
      font-size: 1.35rem;
      line-height: 1.45;
      resize: vertical;
    }

    textarea::placeholder { color: var(--muted); }

    textarea:focus-visible {
      outline: 2px solid var(--copper);
      outline-offset: 3px;
    }

    button {
      max-width: 100%;
      margin: 0;
      padding: 0.7rem 1.15rem;
      border: 0;
      border-radius: 2px;
      background: var(--ink);
      color: var(--paper);
      font-family: var(--mono);
      font-size: 0.72rem;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      cursor: pointer;
    }

    button:hover:not(:disabled) { background: var(--copper); }

    button:focus-visible {
      outline: 2px solid var(--copper);
      outline-offset: 3px;
    }

    button:disabled {
      opacity: 0.55;
      cursor: progress;
    }

    output {
      width: 100%;
      margin: 0;
      font-family: var(--mono);
      font-size: 0.82rem;
      line-height: 1.55;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    output[hidden] { display: none; }
  </style>
</head>
<body>
  <main class="stage">
    <form>
      <textarea name="prompt" rows="4" spellcheck="false" aria-label="Prompt" placeholder="Build a chat interface so I can talk with you in this tab."></textarea>
      <button type="submit">Issue</button>
      <output hidden></output>
    </form>
  </main>
  <script src="boot.js"></script>
  <script>
    var form = document.querySelector("form");
    var box = form.querySelector("textarea");
    var button = form.querySelector("button");
    var reply = form.querySelector("output");

    box.focus();

    form.addEventListener("submit", function (event) {
      event.preventDefault();
      var task = box.value.trim();
      if (!task || button.disabled) return;
      button.disabled = true;
      reply.hidden = true;
      reply.textContent = "";
      agentOnText = function (text) {
        reply.hidden = false;
        reply.textContent = text;
      };
      agentLoad(function (report) {
        var pct = Math.round((report.progress || 0) * 100);
        button.textContent = pct > 0 && pct < 100 ? "Loading " + pct + "%" : "Loading";
      }).then(function () {
        button.textContent = "Running";
        return agentBoot(task);
      }).then(function (text) {
        if (text) {
          reply.hidden = false;
          reply.textContent = text;
        }
      }).catch(function (err) {
        reply.hidden = false;
        reply.textContent = err && err.message ? err.message : String(err);
      }).then(function () {
        button.disabled = false;
        button.textContent = "Issue";
      });
    });
  </script>
</body>
</html>
